name: Release
# Push a tag like v1.0.0 (matching module.json "version") to build and publish the Foundry package.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        run: |
          V=$(jq -r .version module.json)
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "module.json version $V does not match tag ${GITHUB_REF_NAME}"; exit 1; }
          grep -q "const VERSION = \"$V\"" scripts/main.mjs || { echo "scripts/main.mjs VERSION is not $V"; exit 1; }
      - name: Validate JSON and script
        run: |
          for f in module.json data/*.json; do jq empty "$f"; done
          node --check scripts/main.mjs
      - name: Build zip (module.json at zip root)
        run: |
          zip -qr -9 "franchise-wars-${GITHUB_REF_NAME}.zip" . -x '.git/*' '.github/*' 'source/*' '*.md' 'SOURCE-CHECKSUMS.sha256'
          zip -q "franchise-wars-${GITHUB_REF_NAME}.zip" README.md CHANGELOG.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: The Franchise Wars ${{ github.ref_name }}
          body_path: RELEASE-${{ github.ref_name }}.md
          files: |
            franchise-wars-${{ github.ref_name }}.zip
            module.json
